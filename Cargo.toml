# Module: magic_usb.package
# Purpose: Build the shared Rust USB library and service.
# Created: 2026-10-13
# Architecture: Existing libusb runtime and Linux VHCI, no kernel changes.
[package]
name = "magic-usb"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
[workspace]
members = ["clients/csr8510", "clients/ub500"]
[profile.release]
strip = true
