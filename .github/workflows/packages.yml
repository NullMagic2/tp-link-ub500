name: Distribution packages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            target: ubuntu24.04
          - image: ubuntu:26.04
            target: ubuntu26.04
          - image: debian:13
            target: debian13
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential pkg-config dpkg-dev binutils gzip python3 libusb-1.0-0-dev libzstd-dev libgtk-3-dev libplist-dev desktop-file-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.93.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and test
        shell: bash
        run: |
          ./build.sh
          python3 package.py tp-link-ub500
      - name: Verify package installation and removal
        shell: bash
        run: |
          package=$(find outputs -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          apt-get install -y "./$package"
          /usr/libexec/tp-link-ub500/tp-link-ub500 --version
          ldd /usr/libexec/tp-link-ub500/tp-link-ub500 > /tmp/driver-libraries.txt
          if grep -q 'not found' /tmp/driver-libraries.txt; then cat /tmp/driver-libraries.txt; exit 1; fi
          apt-get remove -y tp-link-ub500
      - name: Package for Mint 22 Ubuntu base
        if: matrix.target == 'ubuntu24.04'
        shell: bash
        env:
          PACKAGE_TARGET: mint22
        run: |
          python3 package.py tp-link-ub500
          package=$(find outputs -maxdepth 1 -name '*mint22*.deb' -print -quit)
          apt-get install -y "./$package"
          /usr/libexec/tp-link-ub500/tp-link-ub500 --version
          apt-get remove -y tp-link-ub500
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tp-link-ub500-${{ matrix.target }}
          path: |
            outputs/*.deb
            outputs/*.deb.sha256
          if-no-files-found: error
